<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="petalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <path d="M 200 230 Q 205 320 200 400" stroke="url(#stemGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 198 290 Q 150 270 110 300 Q 150 310 196 295" fill="#16a34a"/>
  <path d="M 202 260 Q 250 240 290 270 Q 250 280 204 265" fill="#15803d"/>

  <!-- Petals -->
  <g transform="translate(200, 180)">
    <!-- Fall petals (down) -->
    <path d="M 0 0 C -45 50 -60 110 0 130 C 60 110 45 50 0 0 Z" fill="url(#petalGlow)" stroke="#6b21a8" stroke-width="2"/>
    <path d="M 0 15 C -25 55 -30 95 0 110 C 30 95 25 55 0 15 Z" fill="#d8b4fe" opacity="0.6"/>
    <path d="M 0 30 L 0 95" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>

    <!-- Left sepal -->
    <path d="M 0 0 C -50 -10 -110 20 -100 65 C -70 85 -30 50 0 0 Z" fill="url(#petalGlow)" stroke="#6b21a8" stroke-width="2"/>
    <path d="M -20 10 C -55 20 -85 45 -70 60 C -50 65 -30 45 -20 10 Z" fill="#fef08a" opacity="0.7"/>

    <!-- Right sepal -->
    <path d="M 0 0 C 50 -10 110 20 100 65 C 70 85 30 50 0 0 Z" fill="url(#petalGlow)" stroke="#6b21a8" stroke-width="2"/>
    <path d="M 20 10 C 55 20 85 45 70 60 C 50 65 30 45 20 10 Z" fill="#fef08a" opacity="0.7"/>

    <!-- Upright standard petals -->
    <path d="M 0 0 C -35 -40 -35 -110 0 -130 C 35 -110 35 -40 0 0 Z" fill="#a855f7" opacity="0.95" stroke="#6b21a8" stroke-width="2"/>
    <path d="M 0 -20 C -20 -50 -15 -90 0 -105 C 15 -90 20 -50 0 -20 Z" fill="#ffffff" opacity="0.3"/>

    <path d="M -10 -5 C -45 -30 -60 -80 -30 -105 C -15 -85 -10 -40 -10 -5 Z" fill="#a855f7" opacity="0.85"/>
    <path d="M 10 -5 C 45 -30 60 -80 30 -105 C 15 -85 10 -40 10 -5 Z" fill="#a855f7" opacity="0.85"/>

    <!-- Center crest -->
    <circle cx="0" cy="5" r="14" fill="#eab308"/>
    <circle cx="0" cy="5" r="8" fill="#ca8a04"/>
  </g>

  <!-- Label Badge -->
  <rect x="20" y="20" width="160" height="38" rx="10" fill="rgba(255,255,255,0.92)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="44" font-family="Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#1e1b4b">Iris Virginica</text>
  <text x="20" y="375" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#64748b">Sepal: 6.5cm | Petal: 5.5cm</text>
</svg>